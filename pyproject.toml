[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ansysem-agent-bridge"
version = "0.1.0a3"
description = "Unofficial local-first agent bridge for Ansys Electronics Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AnsysEM Agent Bridge contributors" }]
keywords = ["ansys", "aedt", "hfss", "pyedb", "pyaedt", "eda", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/cottman99/ansysem-agent-bridge"
Repository = "https://github.com/cottman99/ansysem-agent-bridge"
Issues = "https://github.com/cottman99/ansysem-agent-bridge/issues"

[project.scripts]
ansysem-agent = "ansysem_agent_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ansysem_agent_bridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
